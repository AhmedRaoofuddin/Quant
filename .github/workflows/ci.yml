name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (C++20) — build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y g++ cmake ninja-build
      - name: Configure
        run: cmake -S backend -B backend/build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build (warnings must be clean)
        run: cmake --build backend/build
      - name: Test
        run: ctest --test-dir backend/build --output-on-failure

  frontend:
    name: Frontend (Next.js) — typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f deploy/backend.Dockerfile -t alpha-forge/backend:ci .
      - name: Build frontend image
        run: docker build -f deploy/frontend.Dockerfile -t alpha-forge/frontend:ci .
